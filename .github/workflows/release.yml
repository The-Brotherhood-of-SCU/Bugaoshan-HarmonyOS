name: Release HarmonyOS

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"
  workflow_dispatch:
    inputs:
      version_override:
        description: "Explicit formal version or tag (optional)"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-metadata:
    name: Resolve release metadata
    if: github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && !contains(github.ref_name, '-'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release_title: ${{ steps.resolve.outputs.release_title }}
      should_release: ${{ steps.existing-release.outputs.exists == 'true' && 'false' || steps.resolve.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and channel
        id: resolve
        env:
          INPUT_VERSION_OVERRIDE: ${{ github.event.inputs.version_override || '' }}
        run: python3 .github/scripts/resolve_release_version.py

      - name: Reject preview release versions
        if: steps.resolve.outputs.is_prerelease == 'true'
        run: |
          echo "::error::Preview releases are disabled. Use a formal version on main."
          exit 1

      - name: Skip an already published tag
        id: existing-release
        if: steps.resolve.outputs.should_release == 'true' && steps.resolve.outputs.is_prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

  build-ohos:
    name: Build HarmonyOS HAP
    needs: resolve-metadata
    if: needs.resolve-metadata.outputs.should_release == 'true'
    uses: ./.github/workflows/build-ohos.yml
    with:
      version: ${{ needs.resolve-metadata.outputs.tag }}
    permissions:
      contents: read

  publish-release:
    name: Publish HarmonyOS release
    needs: [resolve-metadata, build-ohos]
    if: needs.resolve-metadata.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve-metadata.outputs.tag }}
      TITLE: ${{ needs.resolve-metadata.outputs.release_title }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download unsigned HAP
        uses: actions/download-artifact@v4
        with:
          name: bugaoshan-ohos-unsigned-hap
          path: ohos-hap

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.12"

      - name: Resolve release tag and range
        id: vars
        run: python .github/scripts/release_tags.py
        env:
          VERSION: ${{ needs.resolve-metadata.outputs.tag }}

      - name: Extract changelog
        id: changelog
        run: python .github/scripts/release_changelog.py
        env:
          VERSION: ${{ steps.vars.outputs.tag }}

      - name: Generate release body
        id: release_body
        run: python .github/scripts/release_body.py
        env:
          VERSION: ${{ steps.vars.outputs.tag }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          PREV: ${{ steps.vars.outputs.prev }}

      - name: Prepare release HAP
        run: python .github/scripts/release_prepare.py
        env:
          VERSION: ${{ steps.vars.outputs.tag }}

      - name: Tag successful build
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            exit 0
          fi
          if git rev-parse --verify "refs/tags/$TAG^{commit}" >/dev/null 2>&1; then
            tagged_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG points to a different commit"
              exit 1
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create draft release and upload HAP
        shell: bash
        env:
          BODY: ${{ steps.release_body.outputs.body }}
        run: |
          printf "%s\n" "$BODY" > notes.md
          gh release create "$TAG" \
            --verify-tag \
            --title "$TITLE" \
            --notes-file notes.md \
            --draft
          gh release upload "$TAG" "bugaoshan_${TAG#v}_ohos_unsigned.hap"

      - name: Publish release
        shell: bash
        run: gh release edit "$TAG" --draft=false --latest
