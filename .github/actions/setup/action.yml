name: Setup CPF Flutter Build Environment
description: Common setup steps for HarmonyOS CI

inputs:
  version:
    description: "Tag name for git metadata"
    required: false
    default: ""

outputs:
  GIT_TAG:
    description: "Git tag"
    value: ${{ steps.git_meta.outputs.GIT_TAG }}
  GIT_COMMIT:
    description: "Git commit hash"
    value: ${{ steps.git_meta.outputs.GIT_COMMIT }}
  GIT_COMMIT_DATE:
    description: "Git commit date"
    value: ${{ steps.git_meta.outputs.GIT_COMMIT_DATE }}

runs:
  using: composite
  steps:
    - name: Fetch all tags
      run: git fetch --tags --force
      shell: bash

    - name: Cache CPF Flutter SDK
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/cpf-flutter
        key: cpf-flutter-${{ runner.os }}-${{ runner.arch }}-f4ab1955d2004ee5655bd0b4ff75bbce2f1de781

    - name: Install CPF Flutter SDK
      shell: bash
      env:
        FLUTTER_ROOT: ${{ runner.temp }}/cpf-flutter
      run: |
        if [ ! -d "$FLUTTER_ROOT/.git" ]; then
          git clone --branch oh-3.44.9-dev --single-branch \
            https://gitcode.com/CPF-Flutter/flutter_flutter.git "$FLUTTER_ROOT"
        fi
        git -C "$FLUTTER_ROOT" checkout --detach f4ab1955d2004ee5655bd0b4ff75bbce2f1de781
        echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_ENV"
        echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"

    - name: Mark Flutter SDK as safe for git
      run: git config --global --add safe.directory "$FLUTTER_ROOT"
      shell: bash

    - name: Configure Pub mirror
      run: echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> "$GITHUB_ENV"
      shell: bash

    - name: Get dependencies
      run: flutter pub get --no-example --enforce-lockfile
      shell: bash
      env:
        GIT_LFS_SKIP_SMUDGE: "1"

    - name: Set up Python 3
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    - name: Extract git metadata
      id: git_meta
      run: python .github/scripts/git_meta.py
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GITHUB_REF_NAME: ${{ github.ref_name }}

    - name: Generate code
      run: dart run build_runner build --delete-conflicting-outputs
      shell: bash

    - name: Generate localizations
      run: flutter gen-l10n
      shell: bash
